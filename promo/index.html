<!doctype html>
<html
  lang="en"
  data-composition-variables='[
    {"id":"cta","type":"string","label":"Call to action","default":"Start free trial"},
    {"id":"primary","type":"color","label":"Brand green","default":"#196747"}
  ]'
>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>Agency promo</title>
    <script src="assets/vendor/gsap.min.js"></script>
    <style>
      @font-face { font-family: 'Geist'; src: url('assets/fonts/Geist-Variable.woff2') format('woff2'); font-weight: 100 900; }
      @font-face { font-family: 'Geist Mono'; src: url('assets/fonts/GeistMono-Regular.woff2') format('woff2'); font-weight: 400; }
      /* Agency design tokens, copied from src/styles/tokens.css (light theme). */
      :root {
        --primary: #196747;
        --c-background: #f7f8f5;
        --c-board: #eef2f6;
        --c-surface: #ffffff;
        --c-subtle: #f0f2ee;
        --c-muted: #e7ebe5;
        --c-fg: #202822;
        --c-fg2: #46534a;
        --c-fg3: #626f65;
        --c-border: #dbe1d9;
        --c-border-subtle: #e9ede6;
        --c-input: #859287;
        --c-primary: var(--primary);
        --c-primary-subtle: #edf5ee;
        --c-primary-muted: #dcecdf;
        --c-primary-border: #a7c9b0;
        --c-primary-text: #174e36;
        --c-highlight: #fae8a6;
        --c-highlight-fg: #644517;
        --c-label-teal: #3c938d;
        --c-label-purple: #9270b0;
        --c-label-orange: #c77e37;
        --c-avatar-1: #93483f;
        --c-avatar-3: #3c7050;
        --c-avatar-4: #426c8a;
        --c-avatar-5: #795581;
        --shadow-sm: 0 1px 2px rgb(32 40 34 / 0.04);
        --shadow-md: 0 3px 10px -3px rgb(32 40 34 / 0.12);
        --shadow-lg: 0 12px 32px -8px rgb(32 40 34 / 0.18), 0 2px 6px rgb(32 40 34 / 0.04);
        --shadow-xl: 0 24px 60px -16px rgb(32 40 34 / 0.25);
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: var(--c-background); }
      body { font-family: 'Geist', sans-serif; color: var(--c-fg); -webkit-font-smoothing: antialiased; }
      #root { position: relative; width: 100%; height: 100%; }
      #ground { position: absolute; inset: 0; background: var(--c-background); }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="32" data-width="1920" data-height="1080">
      <div id="ground"></div>

      <!-- Scenes -->
      <div id="hook" data-composition-id="hook" data-composition-src="compositions/hook.html" data-start="0" data-duration="4.5" data-track-index="1" data-track-kind="graphics" data-width="1920" data-height="1080"></div>
      <div id="board" data-composition-id="board" data-composition-src="compositions/board.html" data-start="4.5" data-duration="6.5" data-track-index="1" data-track-kind="graphics" data-width="1920" data-height="1080"></div>
      <div id="inspector" data-composition-id="inspector" data-composition-src="compositions/inspector.html" data-start="11" data-duration="6" data-track-index="1" data-track-kind="graphics" data-width="1920" data-height="1080"></div>
      <div id="chat" data-composition-id="chat" data-composition-src="compositions/chat.html" data-start="17" data-duration="5" data-track-index="1" data-track-kind="graphics" data-width="1920" data-height="1080"></div>
      <div id="search" data-composition-id="search" data-composition-src="compositions/search.html" data-start="22" data-duration="4.5" data-track-index="1" data-track-kind="graphics" data-width="1920" data-height="1080"></div>
      <div id="endcard" data-composition-id="endcard" data-composition-src="compositions/endcard.html" data-start="26.5" data-duration="5.5" data-track-index="1" data-track-kind="graphics" data-width="1920" data-height="1080"></div>

      <!-- Music bed: assets/music/bed.wav, built by scripts/make_music.py (120 BPM, 32 s). -->
      <audio id="music" class="clip" src="assets/music/bed.wav" data-start="0" data-duration="32" data-track-index="10" data-volume="0.9"></audio>

      <!-- Effects: each placed so its measured peak lands one frame after its picture. -->
      <audio id="sfx-pop-1" class="clip" src="assets/sfx/pop.mp3" data-start="0.41" data-duration="0.72" data-track-index="11" data-volume="0.8"></audio>
      <audio id="sfx-pop-2" class="clip" src="assets/sfx/pop-hi.mp3" data-start="0.93" data-duration="0.61" data-track-index="12" data-volume="0.7"></audio>
      <audio id="sfx-pop-3" class="clip" src="assets/sfx/pop-lo.mp3" data-start="1.41" data-duration="0.72" data-track-index="11" data-volume="0.8"></audio>
      <audio id="sfx-pop-4" class="clip" src="assets/sfx/pop.mp3" data-start="1.91" data-duration="0.72" data-track-index="12" data-volume="0.7"></audio>
      <audio id="sfx-pop-5" class="clip" src="assets/sfx/pop-hi.mp3" data-start="2.43" data-duration="0.61" data-track-index="11" data-volume="0.8"></audio>
      <audio id="sfx-collapse" class="clip" src="assets/sfx/whoosh.mp3" data-start="3.87" data-duration="0.57" data-track-index="13" data-volume="0.9"></audio>
      <audio id="sfx-land" class="clip" src="assets/sfx/pop-lo.mp3" data-start="4.06" data-duration="0.72" data-track-index="12" data-volume="0.9"></audio>

      <audio id="sfx-grab" class="clip" src="assets/sfx/click.mp3" data-start="7.06" data-duration="0.37" data-track-index="11" data-volume="1"></audio>
      <audio id="sfx-drag" class="clip" src="assets/sfx/whoosh-lo.mp3" data-start="7.42" data-duration="0.57" data-track-index="13" data-volume="0.6"></audio>
      <audio id="sfx-drop" class="clip" src="assets/sfx/click-soft.mp3" data-start="7.91" data-duration="0.37" data-track-index="12" data-volume="1"></audio>
      <audio id="sfx-open" class="clip" src="assets/sfx/click.mp3" data-start="9.76" data-duration="0.37" data-track-index="11" data-volume="1"></audio>
      <audio id="sfx-zoom" class="clip" src="assets/sfx/whoosh-hi.mp3" data-start="10.69" data-duration="0.5" data-track-index="13" data-volume="0.8"></audio>

      <audio id="sfx-tick-1" class="clip" src="assets/sfx/click-soft.mp3" data-start="12.16" data-duration="0.37" data-track-index="11" data-volume="1"></audio>
      <audio id="sfx-tick-2" class="clip" src="assets/sfx/click.mp3" data-start="12.56" data-duration="0.37" data-track-index="12" data-volume="0.8"></audio>
      <audio id="sfx-tick-3" class="clip" src="assets/sfx/click-soft.mp3" data-start="12.96" data-duration="0.37" data-track-index="11" data-volume="1"></audio>
      <audio id="sfx-focus" class="clip" src="assets/sfx/click.mp3" data-start="13.56" data-duration="0.37" data-track-index="12" data-volume="0.8"></audio>
      <audio id="sfx-type-1" class="clip" src="assets/sfx/typing.mp3" data-start="13.25" data-duration="1.5" data-track-index="14" data-volume="0.7"></audio>
      <audio id="sfx-enter" class="clip" src="assets/sfx/key-press.mp3" data-start="15.06" data-duration="0.4" data-track-index="11" data-volume="1"></audio>
      <audio id="sfx-whip" class="clip" src="assets/sfx/whoosh.mp3" data-start="16.72" data-duration="0.57" data-track-index="13" data-volume="0.8"></audio>

      <audio id="sfx-message" class="clip" src="assets/sfx/notification.mp3" data-start="17.3" data-duration="1.5" data-track-index="11" data-volume="0.55"></audio>
      <audio id="sfx-reply" class="clip" src="assets/sfx/pop.mp3" data-start="18.31" data-duration="0.72" data-track-index="12" data-volume="0.8"></audio>
      <audio id="sfx-lock" class="clip" src="assets/sfx/pop-lo.mp3" data-start="19.91" data-duration="0.72" data-track-index="11" data-volume="0.8"></audio>

      <audio id="sfx-key-1" class="clip" src="assets/sfx/key-press.mp3" data-start="22.11" data-duration="0.4" data-track-index="11" data-volume="1"></audio>
      <audio id="sfx-key-2" class="clip" src="assets/sfx/key-press.mp3" data-start="22.26" data-duration="0.4" data-track-index="12" data-volume="0.8"></audio>
      <audio id="sfx-morph" class="clip" src="assets/sfx/whoosh-hi.mp3" data-start="22.44" data-duration="0.5" data-track-index="13" data-volume="0.6"></audio>
      <audio id="sfx-type-2" class="clip" src="assets/sfx/typing.mp3" data-start="22.4" data-duration="1.1" data-track-index="14" data-volume="0.6"></audio>
      <audio id="sfx-hit-1" class="clip" src="assets/sfx/pop.mp3" data-start="23.51" data-duration="0.72" data-track-index="11" data-volume="0.8"></audio>
      <audio id="sfx-hit-2" class="clip" src="assets/sfx/pop-hi.mp3" data-start="23.68" data-duration="0.61" data-track-index="12" data-volume="0.7"></audio>
      <audio id="sfx-hit-3" class="clip" src="assets/sfx/pop-lo.mp3" data-start="23.79" data-duration="0.72" data-track-index="17" data-volume="0.8"></audio>
      <audio id="sfx-carry" class="clip" src="assets/sfx/whoosh-lo.mp3" data-start="26.12" data-duration="0.57" data-track-index="13" data-volume="0.7"></audio>

      <audio id="sfx-riser" class="clip" src="assets/sfx/riser.mp3" data-start="25.86" data-duration="3.5" data-track-index="15" data-volume="0.55" data-fade-out="0.1"></audio>
      <audio id="sfx-impact" class="clip" src="assets/sfx/impact-bass-2.mp3" data-start="27.35" data-duration="2.59" data-track-index="16" data-volume="0.8"></audio>
      <audio id="sfx-cta" class="clip" src="assets/sfx/pop.mp3" data-start="29.86" data-duration="0.72" data-track-index="11" data-volume="0.7"></audio>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = gsap.timeline({ paused: true });
    </script>
  </body>
</html>
