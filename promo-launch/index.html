<!doctype html>
<html
  lang="en"
  data-composition-variables='[
    {"id":"cta","type":"string","label":"Call to action","default":"Start free trial"}
  ]'
>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>Agency launch film</title>
    <script src="assets/vendor/gsap.min.js"></script>
    <style>
      @font-face { font-family: 'Geist'; src: url('assets/fonts/Geist-Variable.woff2') format('woff2'); font-weight: 100 900; }
      @font-face { font-family: 'Geist Mono'; src: url('assets/fonts/GeistMono-Regular.woff2') format('woff2'); font-weight: 400; }
      /* Agency design tokens (src/styles/tokens.css), light and dark. */
      :root {
        --green: #196747; --green-hover: #145539; --green-subtle: #edf5ee; --green-muted: #dcecdf; --green-text: #174e36;
        --canvas: #f7f8f5; --board: #eef2f6; --surface: #ffffff; --subtle: #f0f2ee; --muted: #e7ebe5;
        --ink: #202822; --ink2: #46534a; --ink3: #626f65; --border: #dbe1d9; --border-subtle: #e9ede6; --input: #859287;
        --hl: #fae8a6; --hl-ink: #644517;
        --warn-subtle: #fff6e6; --warn-border: #e4c88f; --warn-text: #805012;
        --d-bg: #111714; --d-surface: #19221c; --d-subtle: #202c24; --d-muted: #2d3c31; --d-ink: #e8eee9; --d-ink2: #c0cec3;
        --d-ink3: #9daf9f; --d-border: #35483b; --d-green: #86cba5; --d-green-subtle: #203a2b; --d-green-text: #b0e2c4;
        --d-hl: #56451b; --d-hl-ink: #ffe9a7;
        --l-teal: #3c938d; --l-orange: #c77e37; --l-blue: #548bc0; --l-purple: #9270b0; --l-pink: #bd7196; --l-grey: #7c877f;
        --a1: #93483f; --a2: #805c24; --a3: #3c7050; --a4: #426c8a; --a5: #795581; --a6: #346e68;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: var(--canvas); }
      body { font-family: 'Geist', sans-serif; color: var(--ink); -webkit-font-smoothing: antialiased; }
      #root { position: relative; width: 100%; height: 100%; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="30" data-width="1920" data-height="1080">
      <div id="hook" data-composition-id="hook" data-composition-src="compositions/hook.html" data-start="0" data-duration="5.625" data-track-index="1" data-track-kind="graphics" data-width="1920" data-height="1080"></div>
      <div id="roll" data-composition-id="roll" data-composition-src="compositions/roll.html" data-start="5.625" data-duration="1.875" data-track-index="1" data-track-kind="graphics" data-width="1920" data-height="1080"></div>
      <div id="board" data-composition-id="board" data-composition-src="compositions/board.html" data-start="7.5" data-duration="3.75" data-track-index="1" data-track-kind="graphics" data-width="1920" data-height="1080"></div>
      <div id="card" data-composition-id="card" data-composition-src="compositions/card.html" data-start="11.25" data-duration="3.75" data-track-index="1" data-track-kind="graphics" data-width="1920" data-height="1080"></div>
      <div id="chat" data-composition-id="chat" data-composition-src="compositions/chat.html" data-start="15" data-duration="3.75" data-track-index="1" data-track-kind="graphics" data-width="1920" data-height="1080"></div>
      <div id="search" data-composition-id="search" data-composition-src="compositions/search.html" data-start="18.75" data-duration="3.75" data-track-index="1" data-track-kind="graphics" data-width="1920" data-height="1080"></div>
      <div id="endcard" data-composition-id="endcard" data-composition-src="compositions/endcard.html" data-start="22.5" data-duration="7.5" data-track-index="1" data-track-kind="graphics" data-width="1920" data-height="1080"></div>

      <!-- Music: assets/music/bed.wav from scripts/make_music.py (128 BPM, 30 s). It is the film's clock. -->
      <audio id="music" class="clip" src="assets/music/bed.wav" data-start="0" data-duration="30" data-track-index="10" data-volume="0.95"></audio>

      <!-- Effects, each placed so its measured peak lands one frame after its picture. -->
      <audio id="fx-swell" class="clip" src="assets/sfx/impact-bass-2.mp3" data-start="1.8" data-duration="2.59" data-track-index="11" data-volume="0.75"></audio>
      <audio id="fx-zoom" class="clip" src="assets/sfx/whoosh-hi.mp3" data-start="5.3" data-duration="0.5" data-track-index="12" data-volume="0.8"></audio>
      <audio id="fx-roll-out" class="clip" src="assets/sfx/whoosh-lo.mp3" data-start="7.25" data-duration="0.67" data-track-index="13" data-volume="0.7"></audio>
      <audio id="fx-list" class="clip" src="assets/sfx/click.mp3" data-start="9.34" data-duration="0.37" data-track-index="11" data-volume="1"></audio>
      <audio id="fx-board-out" class="clip" src="assets/sfx/whoosh.mp3" data-start="11.02" data-duration="0.57" data-track-index="12" data-volume="0.8"></audio>
      <audio id="fx-tick-1" class="clip" src="assets/sfx/click-soft.mp3" data-start="11.56" data-duration="0.37" data-track-index="11" data-volume="1"></audio>
      <audio id="fx-tick-2" class="clip" src="assets/sfx/click.mp3" data-start="11.79" data-duration="0.37" data-track-index="13" data-volume="0.7"></audio>
      <audio id="fx-tick-3" class="clip" src="assets/sfx/click-soft.mp3" data-start="12.03" data-duration="0.37" data-track-index="11" data-volume="1"></audio>
      <audio id="fx-drop" class="clip" src="assets/sfx/pop-lo.mp3" data-start="12.36" data-duration="0.72" data-track-index="12" data-volume="1"></audio>
      <audio id="fx-type" class="clip" src="assets/sfx/typing.mp3" data-start="12.7" data-duration="1.0" data-track-index="14" data-volume="0.7"></audio>
      <audio id="fx-due" class="clip" src="assets/sfx/pop-hi.mp3" data-start="14.04" data-duration="0.61" data-track-index="11" data-volume="0.9"></audio>
      <audio id="fx-card-out" class="clip" src="assets/sfx/whoosh-hi.mp3" data-start="14.77" data-duration="0.5" data-track-index="12" data-volume="0.8"></audio>
      <audio id="fx-msg" class="clip" src="assets/sfx/notification.mp3" data-start="14.93" data-duration="1.4" data-track-index="13" data-volume="0.45"></audio>

      <audio id="fx-cmd" class="clip" src="assets/sfx/impact-bass-1.mp3" data-start="18.71" data-duration="2.1" data-track-index="13" data-volume="0.85"></audio>

      <audio id="fx-type-2" class="clip" src="assets/sfx/typing.mp3" data-start="19.35" data-duration="0.9" data-track-index="12" data-volume="0.6"></audio>
      <audio id="fx-res-1" class="clip" src="assets/sfx/pop.mp3" data-start="20.31" data-duration="0.72" data-track-index="11" data-volume="0.8"></audio>
      <audio id="fx-res-2" class="clip" src="assets/sfx/pop-hi.mp3" data-start="20.57" data-duration="0.61" data-track-index="15" data-volume="0.7"></audio>
      <audio id="fx-res-3" class="clip" src="assets/sfx/pop-lo.mp3" data-start="20.77" data-duration="0.72" data-track-index="16" data-volume="0.8"></audio>
      <audio id="fx-dark" class="clip" src="assets/sfx/click.mp3" data-start="21.51" data-duration="0.37" data-track-index="12" data-volume="1"></audio>

      <audio id="fx-slam-3" class="clip" src="assets/sfx/impact-bass-1.mp3" data-start="23.4" data-duration="2.1" data-track-index="15" data-volume="0.7"></audio>
      <audio id="fx-slam-4" class="clip" src="assets/sfx/impact-bass-1.mp3" data-start="23.87" data-duration="2.1" data-track-index="16" data-volume="0.85"></audio>
      <audio id="fx-drop-end" class="clip" src="assets/sfx/impact-bass-1.mp3" data-start="25.28" data-duration="2.1" data-track-index="12" data-volume="1"></audio>
      <audio id="fx-cta" class="clip" src="assets/sfx/pop.mp3" data-start="26.64" data-duration="0.72" data-track-index="13" data-volume="0.8"></audio>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = gsap.timeline({ paused: true });
    </script>
  </body>
</html>
